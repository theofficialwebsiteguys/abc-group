<section class="testimonial-banner">
  <blockquote class="quote fade-in">
    <span class="quote-mark">“</span>
    {{ quote }}
    <span class="quote-mark">”</span>
  </blockquote>

  <div class="client">
    <img [src]="avatar" [alt]="name" />
    <div class="client-text">
      <span class="name">{{ name }}</span>
    </div>
  </div>
</section>
