<section class="hero">
  <!-- Background slideshow -->
  <div class="bg">
    <img *ngFor="let image of bgImages; let i = index"
         [src]="image" [class.active]="i === currentImageIndex" alt=""/>
    <div class="vignette"></div>
    <div class="gradient"></div>
  </div>

  <!-- Content -->
  <div class="container">
    <div class="copy">
      <p class="kicker">Consulting • Growth • People</p>

      <h1>
        <span class="accent">Atlanta’s Trusted</span><br/>
        Consulting Partner
      </h1>

      <p class="sub">
        We help brands scale with strategy, leadership development, and performance marketing.
      </p>

      <div class="cta-row">
        <a routerLink="/contact" class="btn primary">Start a Project</a>
        <a routerLink="/impact" class="btn ghost">See Our Impact</a>
      </div>

      <ul class="quick-stats" aria-label="Company highlights">
        <li><strong>200+</strong> partners</li>
        <li><strong>10yrs</strong> of impact</li>
        <li><strong>ROI</strong>-focused</li>
      </ul>
    </div>

    <aside class="card">
      <div class="testimonial" *ngFor="let t of testimonials; let i = index" [class.active]="i===currentQuoteIndex">
        <p class="quote">“{{t.quote}}”</p>
        <p class="author">— {{t.author}}</p>
      </div>
    </aside>
  </div>
</section>
