<section class="hero">
  <!-- Background slideshow -->
  <div class="bg" aria-hidden="true">
    <img *ngFor="let image of bgImages; let i = index"
         [src]="image" [class.active]="i === currentImageIndex" alt="" />
  </div>

  <div class="ui-container hero-inner">
    <p class="ui-kicker ui-kicker--light">Consulting • Growth • People</p>

    <h1>Atlanta’s <em>Trusted</em><br />Consulting Partner</h1>

    <p class="sub">
      We help brands scale with strategy, leadership development, and performance marketing.
    </p>

    <div class="actions">
      <a routerLink="/contact" class="ui-btn ui-btn--solid">Apply Today <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
      <a routerLink="/impact" class="ui-btn ui-btn--light">See Our Impact</a>
    </div>
  </div>

  <div class="slide-dots" aria-hidden="true">
    <span *ngFor="let image of bgImages; let i = index" [class.active]="i === currentImageIndex"></span>
  </div>
</section>

<div class="ui-container">
  <ul class="stats" aria-label="Company highlights">
    <li><strong>200+</strong><span>Partners</span></li>
    <li><strong>10yrs</strong><span>Of Impact</span></li>
    <li><strong>ROI</strong><span>Focused</span></li>
  </ul>
</div>
