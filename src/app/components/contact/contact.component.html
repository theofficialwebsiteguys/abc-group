<section class="contact-section">
  <div class="contact-header">
    <p class="section-label">Contact</p>
    <h2>Let’s Talk About Your Goals</h2>
    <p class="section-subtext">
      Whether you’re ready to scale or just exploring options, we’d love to connect.
    </p>
  </div>

 <div class="contact-content">
  <!-- LEFT: Contact Form -->
  <form class="contact-form" (submit)="onSubmit()">
    <div class="form-group">
      <input type="text" placeholder="Full Name" [(ngModel)]="name" name="name" required />
    </div>
    <div class="form-group">
      <input type="email" placeholder="Email Address" [(ngModel)]="email" name="email" required />
    </div>
    <div class="form-group">
      <input type="tel" placeholder="Phone" [(ngModel)]="phone" name="phone" />
    </div>
    <div class="form-group">
      <textarea placeholder="Tell us about your project or goals..." [(ngModel)]="message" name="message" rows="5" required></textarea>
    </div>
    <button class="btn primary" type="submit">Send Message</button>
  </form>

  <!-- RIGHT: Contact Info + Map -->
  <div class="contact-info-wrapper">
    <div class="contact-info">
      <h3>Prefer to Reach Out Directly?</h3>
      <p>Email us at <a href="mailto:hr@abcgroupatl.com">hr&#64;abcgroupatl.com</a></p>
      <p>Or call us: <a href="tel:+16788797278">(678) 879–7278</a></p>
    </div>

    <div #mapWrapper class="map-container">
     <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3313.5854462442335!2d-84.31346802368938!3d33.84880002844432!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x88f5087e12bfffff%3A0xbdc2ebf26a84e32b!2sABC%20Consultants%20group!5e0!3m2!1sen!2sus!4v1762802291368!5m2!1sen!2sus" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>
</div>

</section>
