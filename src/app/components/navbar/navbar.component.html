<!-- ===== Utility Bar ===== -->
<div class="utility-bar">
  <div class="ui-container utility-inner">
    <p class="rating">
      <span class="stars" aria-hidden="true">
        <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-regular fa-star-half-stroke"></i>
      </span>
      Rated 4.9 / 5 from partners nationwide
    </p>

    <div class="utility-links">
      <a href="tel:+16788797278"><i class="fa-solid fa-phone" aria-hidden="true"></i> (678) 879–7278</a>
      <a href="mailto:hr&#64;abcgroupatl.com"><i class="fa-regular fa-envelope" aria-hidden="true"></i> hr&#64;abcgroupatl.com</a>
      <span class="social">
        <a target="_blank" rel="noopener" aria-label="Facebook" href="https://www.facebook.com/abcgroupatl/"><i class="fab fa-facebook-f"></i></a>
        <a target="_blank" rel="noopener" aria-label="Instagram" href="https://www.instagram.com/abcgroupatl/?hl=en"><i class="fab fa-instagram"></i></a>
        <a target="_blank" rel="noopener" aria-label="LinkedIn" href="https://www.linkedin.com/company/abc-consultants-group-atl/"><i class="fab fa-linkedin-in"></i></a>
      </span>
    </div>
  </div>
</div>

<!-- ===== Main Bar ===== -->
<header class="main-bar">
  <a routerLink="/" class="brand" aria-label="ABC Consultants Group home">
    <img src="assets/logo.png" alt="" class="logo" />
    <span class="wordmark">ABC <small>Consultants Group</small></span>
  </a>

  <nav class="main-nav" aria-label="Main">
    <ul>
      <li *ngFor="let link of links"><a [routerLink]="link.route" routerLinkActive="active">{{ link.text }}</a></li>
      <li *ngIf="applyUrl"><a routerLink="/contact" routerLinkActive="active">Contact</a></li>
    </ul>
  </nav>

  <a *ngIf="applyUrl; else contactCta" [href]="applyUrl" class="nav-cta">Apply Today <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
  <ng-template #contactCta>
    <a routerLink="/contact" class="nav-cta">Contact Us <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
  </ng-template>

  <button class="hamburger"
          [class.open]="isMobileMenuOpen"
          (click)="toggleMenu()"
          aria-label="Toggle navigation"
          [attr.aria-expanded]="isMobileMenuOpen">
    <span></span><span></span><span></span>
  </button>
</header>

<!-- Overlay -->
<div class="menu-overlay" [class.open]="isMobileMenuOpen" (click)="toggleMenu()"></div>

<!-- Mobile Drawer -->
<aside class="mobile-menu" [class.open]="isMobileMenuOpen" role="dialog" aria-modal="true" aria-label="Menu">
  <button class="close-btn" (click)="toggleMenu()" aria-label="Close menu">×</button>
  <ul>
    <li *ngFor="let link of links"><a [routerLink]="link.route" routerLinkActive="active" (click)="toggleMenu()">{{ link.text }}</a></li>
    <li><a routerLink="/contact" routerLinkActive="active" (click)="toggleMenu()">Contact</a></li>
  </ul>

  <a *ngIf="applyUrl" [href]="applyUrl" class="ui-btn ui-btn--solid drawer-cta">Apply Today <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>

  <div class="drawer-footer">
    <a href="tel:+16788797278"><i class="fa-solid fa-phone" aria-hidden="true"></i> (678) 879–7278</a>
    <a href="mailto:hr&#64;abcgroupatl.com"><i class="fa-regular fa-envelope" aria-hidden="true"></i> hr&#64;abcgroupatl.com</a>
    <div class="social">
      <a target="_blank" rel="noopener" aria-label="Facebook" href="https://www.facebook.com/abcgroupatl/"><i class="fab fa-facebook-f"></i></a>
      <a target="_blank" rel="noopener" aria-label="Instagram" href="https://www.instagram.com/abcgroupatl/?hl=en"><i class="fab fa-instagram"></i></a>
      <a target="_blank" rel="noopener" aria-label="LinkedIn" href="https://www.linkedin.com/company/abc-consultants-group-atl/"><i class="fab fa-linkedin-in"></i></a>
    </div>
  </div>
</aside>
