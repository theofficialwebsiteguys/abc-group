<app-cta
  [title]="'Markets'"
  [description]="'Our reach spans across major U.S. cities — each led by passionate entrepreneurs driving growth, culture, and opportunity. Explore our markets to see how we’re building success nationwide.'"
  [backgroundImage]="'assets/banners/markets-banner.jpg'"
></app-cta>


<section class="markets-showcase">
  <!-- Headquarters -->
  <div class="markets-headquarters">
    <h2 class="section-heading">Our Headquarters</h2>
    <div
      class="market-item hq"
      [style.backgroundImage]="'url(' + markets[0].image + ')'"
      (click)="handleMemberSelect(markets[0].data)"
      [class.active]="selectedState?.name === markets[0].data.name"
    >
      <div class="market-overlay"></div>
      <div class="market-info">
        <h3>{{ markets[0].title }}</h3>
        <p>{{ markets[0].description }}</p>
      </div>
    </div>
  </div>

  <!-- Other Markets -->
  <div class="markets-regional">
    <h2 class="section-heading">Our Regional Markets</h2>
    <div class="markets-wrapper">
      <div
        class="market-item"
        *ngFor="let market of markets.slice(1)"
        [style.backgroundImage]="'url(' + market.image + ')'"
        (click)="handleMemberSelect(market.data)"
        [class.active]="selectedState?.name === market.data.name"
      >
        <div class="market-overlay"></div>
        <div class="market-info">
          <h3>{{ market.title }}</h3>
          <p>{{ market.description }}</p>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Selected Detail -->
<app-detail-section
  id="state-details"
  *ngIf="selectedState"
  [imageUrls]="selectedState.images"
  [title]="selectedState.name"
  [description]="selectedState.desc1"
  [description2]="selectedState.desc2"
  [imageLeft]="true"
  [background]="'green'"
></app-detail-section>
