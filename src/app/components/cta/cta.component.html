<section
  class="page-banner"
  [ngStyle]="{ 'background-image': backgroundImage ? 'url(' + backgroundImage + ')' : 'none' }"
>
  <div class="ui-container">
    <p class="crumbs"><a routerLink="/">Home</a><span aria-hidden="true">/</span>{{ title }}</p>
    <h1>{{ title }}</h1>
    <p *ngIf="description" class="sub">{{ description }}</p>

    <div class="cta-row" *ngIf="primaryButtonText || secondaryButtonText">
      <a *ngIf="primaryButtonText" routerLink="/contact" class="ui-btn ui-btn--solid">{{ primaryButtonText }}</a>
      <a *ngIf="secondaryButtonText" routerLink="/about" class="ui-btn ui-btn--light">{{ secondaryButtonText }}</a>
    </div>
  </div>
</section>
